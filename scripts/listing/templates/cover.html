<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>{{title}} cover</title>
    <link rel="stylesheet" href="listing.css" />
  </head>
  <body class="cover type-{{type}}">
    <div class="ghost ghost-title display" aria-hidden="true">{{title}}</div>
    <header class="meta label">
      <span class="mark"></span>
      <span>{{kind}}</span>
      {{{chip}}}
      <span class="spacer"></span>
      {{{sample}}}
    </header>
    <section class="copy">
      <h1 class="display cover-title" data-fit="60">{{title}}</h1>
      <div class="accent-bar"></div>
      <p class="tagline" data-fit="26">{{tagline}}</p>
    </section>
    <figure class="stage">{{{frame}}}</figure>
  </body>
</html>
